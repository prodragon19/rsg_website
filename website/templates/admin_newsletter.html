<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='rsgfav.png') }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Post Newsletter | RSG Software</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container" style="max-width: 600px; margin-top: 60px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h3 class="mb-4">Post new newsletter update</h3>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data">  <!-- �������� CRITICAL FOR FILE UPLOADS -->
                <!-- AUTHOR FIELD -->
                <div class="form-group">
                    <label for="author">Your Name (Author)</label>
                    <input type="text" name="author" class="form-control" placeholder="Your name" required>
                </div>
                
                <!-- TITLE FIELD -->
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" name="title" class="form-control" placeholder="Title" required>
                </div>
                
                <!-- IMAGE UPLOAD FIELD -->
                <div class="form-group">
                    <label for="image">Newsletter Image (Optional)</label>
                    <input type="file" name="image" class="form-control-file" accept="image/*">
                    <small class="form-text text-muted">Supported: JPG, PNG, GIF (Max 5MB)</small>
                </div>
                
                <!-- CONTENT FIELD -->
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea name="content" class="form-control" rows="6" placeholder="Write your update here..." required></textarea>
                </div>
                
                <button type="submit" class="btn btn-dark btn-block">Publish</button>
            </form>

            <a href="{{ url_for('views.newsletter') }}" class="btn btn-link mt-3">← Back to Newsletter</a>
        </div>
    </div>
</div>

</body>
</html>
