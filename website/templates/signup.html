<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='rsgfav.png') }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up | RSG Software</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .signup-box { max-width: 420px; margin: 80px auto; }
        .logo { width: 180px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="signup-box">
    <div class="card shadow">
        <div class="card-body p-4 text-center">

            <img src="https://i.postimg.cc/rwKST91B/rsgsoftware.png" alt="RSG Software Logo" class="logo">

            <h3 class="mb-4">Create Account</h3>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            {% if success %}
                <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group text-left">
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="form-group text-left">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="form-group text-left">
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn btn-dark btn-block">Sign Up</button>
            </form>

            <p class="mt-3 mb-0">
                Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
