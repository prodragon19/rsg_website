<!doctype html><title>Create account | RSG</title><link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"><main class="container" style="max-width:440px;margin-top:70px"><div class="card card-body"><h1 class="h3">Create your account</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-2" name="name" placeholder="Name" required><input class="form-control mb-2" name="email" type="email" placeholder="Email" required><input class="form-control mb-3" name="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><button class="btn btn-dark btn-block">Sign up</button></form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></div></main>
