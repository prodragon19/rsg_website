<!DOCTYPE html>
<html>

<head>

<title>Orders</title>

<link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

</head>


<body>


<div class="container mt-5">


<h1>
Orders
</h1>


<table class="table">


<tr>

<th>ID</th>

<th>Status</th>

<th>Payment</th>

<th>Amount</th>

<th></th>

</tr>



{% for order in orders %}


<tr>


<td>
#{{ order.id }}
</td>


<td>
{{ order.status }}
</td>


<td>
{{ order.payment_status }}
</td>


<td>
{{ order.amount }} SEK
</td>


<td>


<a class="btn btn-danger btn-sm"
href="{{ url_for('admin.refund_order', id=order.id) }}">

Refund

</a>


</td>


</tr>



{% endfor %}



</table>


</div>


</body>

</html>
