<!DOCTYPE html>
<html>

<head>

<title>Admins</title>

<link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

</head>


<body>


<div class="container mt-5">


<div class="d-flex justify-content-between">

<h1>
Admin Accounts
</h1>


<a href="{{ url_for('admin.create_admin') }}"
class="btn btn-dark">

Create Admin

</a>

</div>



<table class="table table-striped mt-4">


<tr>

<th>
Username
</th>

<th>
Email
</th>

<th>
Role
</th>

<th>
Status
</th>

<th>
Actions
</th>

</tr>



{% for user in users %}


<tr>


<td>
{{ user.username }}
</td>


<td>
{{ user.email }}
</td>


<td>
{{ user.role }}
</td>


<td>

{% if user.enabled %}

<span class="text-success">
Active
</span>

{% else %}

<span class="text-danger">
Disabled
</span>

{% endif %}

</td>



<td>


{% if user.enabled %}

<a href="{{ url_for('admin.disable_admin', id=user.id) }}"
class="btn btn-warning btn-sm">

Disable

</a>


{% else %}


<a href="{{ url_for('admin.enable_admin', id=user.id) }}"
class="btn btn-success btn-sm">

Enable

</a>


{% endif %}




<a href="{{ url_for('admin.delete_admin', id=user.id) }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this admin?');">

Delete

</a>



</td>


</tr>


{% endfor %}



</table>


</div>


</body>

</html>
