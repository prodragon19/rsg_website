<!DOCTYPE html>
<html>

<head>

<title>Create Admin</title>

<link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

</head>


<body>


<div class="container mt-5">


<h1>
Create Admin
</h1>



<form method="POST">


<input type="hidden"
name="csrf_token"
value="{{ csrf_token() }}">



<div class="form-group">

<label>
Username
</label>

<input class="form-control"
name="username"
required>

</div>



<div class="form-group">

<label>
Email
</label>

<input class="form-control"
name="email"
type="email"
required>

</div>



<div class="form-group">

<label>
Password
</label>

<input class="form-control"
name="password"
type="password"
required>

</div>




<div class="form-group">

<label>
Role
</label>


<select class="form-control"
name="role">


<option>
Admin
</option>


<option>
Support
</option>


<option>
Owner
</option>


</select>


</div>



<button class="btn btn-dark">

Create

</button>



</form>



</div>


</body>

</html>
