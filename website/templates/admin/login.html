<!DOCTYPE html>
<html>

<head>

<title>Admin Login | RSG Software</title>

<link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

</head>


<body class="bg-light">


<div class="container">

<div class="row justify-content-center">

<div class="col-md-5 mt-5">


<div class="card shadow">

<div class="card-body">


<h3 class="mb-4">
RSG Admin Login
</h3>


<form method="POST">


<input type="hidden"
name="csrf_token"
value="{{ csrf_token() }}">



<div class="form-group">

<label>
Username
</label>

<input class="form-control"
name="username"
required>

</div>



<div class="form-group">

<label>
Password
</label>

<input type="password"
class="form-control"
name="password"
required>

</div>



<button class="btn btn-dark btn-block">

Login

</button>


</form>


</div>

</div>


</div>

</div>

</div>


</body>

</html>
